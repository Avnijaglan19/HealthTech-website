<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Results | Smart Workout Recommender</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page">
        <div class="container">
            <div class="topbar">
                <h1>🏋️ Workout Results</h1>
            </div>

            <div class="results-box">
                <h2>Generated Prompt</h2>
                <pre class="results-pre">{{ workout.prompt }}</pre>

                <h2>Generated Workout Plan</h2>
                <pre class="results-pre">{{ generated_plan }}</pre>

                {% if youtube_embeds %}
                <h2>Exercise Demonstrations</h2>
                <div class="video-grid">
                    {% for video_url in youtube_embeds %}
                    <div class="video-card">
                        <iframe
                            width="100%"
                            height="315"
                            src="{{ video_url }}"
                            title="YouTube video player"
                            frameborder="0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            allowfullscreen>
                        </iframe>
                    </div>
                    {% endfor %}
                </div>
                {% endif %}
            </div>
        </div>
    </div>
    <div class="end-workout-container">
    <a href="{{ url_for('dashboard') }}" class="end-workout-btn">
        ✅ End Workout
    </a>
</div>
</body>
</html>
<p>{{ youtube_embeds }}</p>
